# Production stack. Shipped to the server by .github/workflows/deploy.yml,
# which writes the .env this file reads. IMAGE and PORT come from that .env.
name: bangla-bazar-server-prod

services:
  app:
    image: ${IMAGE}
    restart: unless-stopped
    env_file: .env

    ports:
      - "127.0.0.1:${PORT}:${PORT}"
    volumes:
      - uploads:/app/uploads
      - logs:/app/logs
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      # No curl in the slim runtime image; node 22 has fetch built in.
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:'+process.env.PORT+'/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    networks: [app-net]

  # server.ts calls startWorkers() before listening, and OTPs live in Redis —
  # the app cannot boot without this.
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    volumes:
      - redis-data:/data
    networks: [app-net]

volumes:
  uploads:
  logs:
  redis-data:

networks:
  app-net:
