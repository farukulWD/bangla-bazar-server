

server {
    listen 80;
    listen [::]:80;
    server_name banglabazar.api.smarttaxbd.com;


    client_max_body_size 12m;

    location / {
        # Compose publishes the app on loopback only, so this is the sole
        # route in. PORT=5055 must match the PORT secret.
        proxy_pass http://127.0.0.1:5055;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;

        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Long-lived websockets idle past nginx's 60s default.
        proxy_read_timeout  300s;
        proxy_send_timeout  300s;
    }
}
