name: CI/CD

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    environment: Production
    steps:
      - uses: actions/checkout@v4

      - name: Check required secrets
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          PORT: ${{ secrets.PORT }}
          MONGO_URI: ${{ secrets.MONGO_URI }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          JWT_REFRESH_SECRET: ${{ secrets.JWT_REFRESH_SECRET }}
          SALT_ROUND: ${{ secrets.SALT_ROUND }}
          CLIENT_URL: ${{ secrets.CLIENT_URL }}
          SERVER_PUBLIC_URL: ${{ secrets.SERVER_PUBLIC_URL }}
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
          STORE_ID: ${{ secrets.STORE_ID }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          EMAIL_HOST: ${{ secrets.EMAIL_HOST }}
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
        run: |
          missing=""
          for key in DOCKERHUB_USERNAME DOCKERHUB_TOKEN SSH_HOST SSH_USER \
            SSH_PORT SSH_PRIVATE_KEY PORT MONGO_URI JWT_SECRET \
            JWT_REFRESH_SECRET SALT_ROUND CLIENT_URL SERVER_PUBLIC_URL \
            CLOUDINARY_CLOUD_NAME CLOUDINARY_API_KEY CLOUDINARY_API_SECRET \
            STORE_ID STORE_PASSWORD; do
            [ -n "${!key}" ] || missing="$missing $key"
          done

          # Email is degraded-but-bootable: password reset and OTP mail stop
          # working, the server still starts. Warn rather than block.
          for key in EMAIL_HOST EMAIL_USER EMAIL_PASSWORD EMAIL_FROM; do
            [ -n "${!key}" ] || echo "::warning::$key is unset — transactional email will not send"
          done

          if [ -n "$missing" ]; then
            echo "::error::Missing secrets in the Production environment:$missing"
            exit 1
          fi

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true

          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/bangla-bazar-server:prod
            ${{ secrets.DOCKERHUB_USERNAME }}/bangla-bazar-server:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Prepare remote directory
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          port: ${{ secrets.SSH_PORT }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: mkdir -p /opt/bangla-bazar-server/prod/server

      - name: Copy compose file
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          port: ${{ secrets.SSH_PORT }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: docker-compose.yml
          target: /opt/bangla-bazar-server/prod/server
          overwrite: true

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        env:
          IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/bangla-bazar-server:${{ github.sha }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

          NODE_ENV: production
          PORT: ${{ secrets.PORT }}
          MONGO_URI: ${{ secrets.MONGO_URI }}

          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          JWT_REFRESH_SECRET: ${{ secrets.JWT_REFRESH_SECRET }}
          JWT_EXPIRATION: ${{ secrets.JWT_EXPIRATION }}
          JWT_REFRESH_EXPIRATION: ${{ secrets.JWT_REFRESH_EXPIRATION }}
          SALT_ROUND: ${{ secrets.SALT_ROUND }}

          CLIENT_URL: ${{ secrets.CLIENT_URL }}
          CLIENT_URLS: ${{ secrets.CLIENT_URLS }}
          SERVER_PUBLIC_URL: ${{ secrets.SERVER_PUBLIC_URL }}
          REFRESH_COOKIE_MAX_AGE_MS: ${{ secrets.REFRESH_COOKIE_MAX_AGE_MS }}

          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}

          EMAIL_SERVICE: ${{ secrets.EMAIL_SERVICE }}
          EMAIL_HOST: ${{ secrets.EMAIL_HOST }}
          EMAIL_PORT: ${{ secrets.EMAIL_PORT }}
          EMAIL_SECURE: ${{ secrets.EMAIL_SECURE }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_TLS_REJECT_UNAUTHORIZED: ${{ secrets.EMAIL_TLS_REJECT_UNAUTHORIZED }}

          OTP_CODE_TTL_SECONDS: ${{ secrets.OTP_CODE_TTL_SECONDS }}
          OTP_PENDING_TTL_SECONDS: ${{ secrets.OTP_PENDING_TTL_SECONDS }}
          OTP_MAX_ATTEMPTS: ${{ secrets.OTP_MAX_ATTEMPTS }}
          PASSWORD_RESET_TOKEN_TTL_SECONDS: ${{ secrets.PASSWORD_RESET_TOKEN_TTL_SECONDS }}

          STORE_ID: ${{ secrets.STORE_ID }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          SSL_IS_LIVE: ${{ secrets.SSL_IS_LIVE }}
          SSL_IPN_ALLOWED_IPS: ${{ secrets.SSL_IPN_ALLOWED_IPS }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          port: ${{ secrets.SSH_PORT }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: IMAGE,DOCKERHUB_USERNAME,DOCKERHUB_TOKEN,NODE_ENV,PORT,MONGO_URI,JWT_SECRET,JWT_REFRESH_SECRET,JWT_EXPIRATION,JWT_REFRESH_EXPIRATION,SALT_ROUND,CLIENT_URL,CLIENT_URLS,SERVER_PUBLIC_URL,REFRESH_COOKIE_MAX_AGE_MS,CLOUDINARY_CLOUD_NAME,CLOUDINARY_API_KEY,CLOUDINARY_API_SECRET,EMAIL_SERVICE,EMAIL_HOST,EMAIL_PORT,EMAIL_SECURE,EMAIL_FROM,EMAIL_USER,EMAIL_PASSWORD,EMAIL_TLS_REJECT_UNAUTHORIZED,OTP_CODE_TTL_SECONDS,OTP_PENDING_TTL_SECONDS,OTP_MAX_ATTEMPTS,PASSWORD_RESET_TOKEN_TTL_SECONDS,STORE_ID,STORE_PASSWORD,SSL_IS_LIVE,SSL_IPN_ALLOWED_IPS
          script: |
            set -e
            mkdir -p /opt/bangla-bazar-server/prod/server
            cd /opt/bangla-bazar-server/prod/server
            echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin

            # 077 first so the file is never briefly world-readable.
            umask 077
            cat > .env <<EOF
            IMAGE=$IMAGE
            NODE_ENV=$NODE_ENV
            PORT=$PORT
            MONGO_URI=$MONGO_URI
            # Redis is a compose service on the app network, not a repo secret.
            REDIS_URL=redis://redis:6379
            JWT_SECRET=$JWT_SECRET
            JWT_REFRESH_SECRET=$JWT_REFRESH_SECRET
            JWT_EXPIRATION=$JWT_EXPIRATION
            JWT_REFRESH_EXPIRATION=$JWT_REFRESH_EXPIRATION
            SALT_ROUND=$SALT_ROUND
            CLIENT_URL=$CLIENT_URL
            CLIENT_URLS=$CLIENT_URLS
            SERVER_PUBLIC_URL=$SERVER_PUBLIC_URL
            REFRESH_COOKIE_MAX_AGE_MS=$REFRESH_COOKIE_MAX_AGE_MS
            CLOUDINARY_CLOUD_NAME=$CLOUDINARY_CLOUD_NAME
            CLOUDINARY_API_KEY=$CLOUDINARY_API_KEY
            CLOUDINARY_API_SECRET=$CLOUDINARY_API_SECRET
            EMAIL_SERVICE=$EMAIL_SERVICE
            EMAIL_HOST=$EMAIL_HOST
            EMAIL_PORT=$EMAIL_PORT
            EMAIL_SECURE=$EMAIL_SECURE
            EMAIL_FROM=$EMAIL_FROM
            EMAIL_USER=$EMAIL_USER
            EMAIL_PASSWORD=$EMAIL_PASSWORD
            EMAIL_TLS_REJECT_UNAUTHORIZED=$EMAIL_TLS_REJECT_UNAUTHORIZED
            OTP_CODE_TTL_SECONDS=$OTP_CODE_TTL_SECONDS
            OTP_PENDING_TTL_SECONDS=$OTP_PENDING_TTL_SECONDS
            OTP_MAX_ATTEMPTS=$OTP_MAX_ATTEMPTS
            PASSWORD_RESET_TOKEN_TTL_SECONDS=$PASSWORD_RESET_TOKEN_TTL_SECONDS
            STORE_ID=$STORE_ID
            STORE_PASSWORD=$STORE_PASSWORD
            SSL_IS_LIVE=$SSL_IS_LIVE
            SSL_IPN_ALLOWED_IPS=$SSL_IPN_ALLOWED_IPS
            EOF
            # SSL_IPN_ALLOW_ANY_IP is deliberately absent even though the secret
            # exists: src/app/modules/payment refuses to boot with it enabled in
            # production.
            chmod 600 .env

            # docker-compose.yml arrives from the repo via the scp step above.
            docker compose pull
            docker compose up -d --remove-orphans
            docker image prune -f
            docker logout
